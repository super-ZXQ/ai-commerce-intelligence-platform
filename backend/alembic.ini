# Alembic - database schema versioning (single migration tree)
# Run from repo root:
#   python -m alembic -c backend/alembic.ini upgrade head
# Or from backend/:
#   python -m alembic upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
path_separator = os
version_path_separator = os
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
