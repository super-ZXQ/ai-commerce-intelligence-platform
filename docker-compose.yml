services:
  mysql:
    image: mysql:8.0
    container_name: ea-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在根目录 .env 中设置 DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-ai_commerce_intelligence_platform}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Schema 由 db-migrate（Alembic）创建，不在 initdb 执行业务 DDL。
      # sql/01_create_table.sql 仅作参考 DDL，与 backend/alembic 对齐并由测试校验。
      # 订单数据只能由 data-import profile 显式导入，后端启动不再写入 orders。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:?请设置 DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ea-network

  db-bootstrap:
    image: mysql:8.0
    container_name: ea-db-bootstrap
    restart: "no"
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD:?请在根目录 .env 中设置 DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-ai_commerce_intelligence_platform}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?请设置 DB_APP_PASSWORD}
      DB_AI_PASSWORD: ${DB_AI_PASSWORD:?请设置 DB_AI_PASSWORD}
      DB_SYNC_PASSWORD: ${DB_SYNC_PASSWORD:?请设置 DB_SYNC_PASSWORD}
      DB_EVENT_PASSWORD: ${DB_EVENT_PASSWORD:?请设置 DB_EVENT_PASSWORD}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:?请设置 DB_AUTH_PASSWORD}
      DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD:-}
    volumes:
      - ./deploy/mysql/bootstrap-users.sh:/bootstrap-users.sh:ro
    entrypoint: ["sh", "/bootstrap-users.sh"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ea-network

  # 一次性 schema 升级：仅此服务跑 Alembic，Web worker 不抢 migration
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ea-db-migrate
    restart: "no"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ai_commerce_intelligence_platform}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-ea_migrate}
      MIGRATION_DB_PASSWORD: ${DB_MIGRATE_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?请在根目录 .env 中设置 JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在根目录 .env 中设置 ADMIN_PASSWORD}
      DEBUG: ${DEBUG:-false}
      REDIS_ENABLED: "false"
    entrypoint: ["python", "-m", "alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - ea-network

  # 一次性表级授权：迁移完成后收紧 ea_app/ea_ai/ea_events，并授予 ea_auth 认证表权限。
  db-grant:
    image: mysql:8.0
    container_name: ea-db-grant
    restart: "no"
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD:?请在根目录 .env 中设置 DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-ai_commerce_intelligence_platform}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:?请设置 DB_AUTH_PASSWORD}
    volumes:
      - ./deploy/mysql/apply-grants.sh:/apply-grants.sh:ro
    entrypoint: ["sh", "/apply-grants.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - ea-network

  redis:
    image: redis:7-alpine
    container_name: ea-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    expose:
      - "6379"
    volumes:
      - redis_data:/data
      - ./deploy/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ea-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ea-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ea_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?请设置 DB_APP_PASSWORD}
      DB_NAME: ${DB_NAME:-ai_commerce_intelligence_platform}
      # 认证目录独立账号：只能访问认证/审计表，不能读业务数据。
      AUTH_DB_USER: ea_auth
      AUTH_DB_PASSWORD: ${DB_AUTH_PASSWORD:?请设置 DB_AUTH_PASSWORD}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-ea_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      # 会话逻辑 DB 只是命名隔离；同一 Redis 实例的淘汰策略仍全局生效。
      REDIS_SESSION_DB: ${REDIS_SESSION_DB:-1}
      REDIS_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?请在根目录 .env 中设置 JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在根目录 .env 中设置 ADMIN_PASSWORD}
      ANALYST_USERNAME: ${ANALYST_USERNAME:-analyst}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_MODE: ${LLM_MODE:-managed}
      ALLOW_BYOK: ${ALLOW_BYOK:-false}
      LLM_PROVIDER_ALLOWLIST: ${LLM_PROVIDER_ALLOWLIST:-api.deepseek.com}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-2}
      AI_MAX_INFLIGHT_PER_USER: ${AI_MAX_INFLIGHT_PER_USER:-1}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-200}
      AI_QUEUE_TIMEOUT_SECONDS: ${AI_QUEUE_TIMEOUT_SECONDS:-10}
      AI_QUERY_TIMEOUT_SECONDS: ${AI_QUERY_TIMEOUT_SECONDS:-120}
      TRUST_PROXY_HEADERS: "true"
      RAG_STATS_PATH: /app/ai-ecommerce-assistant/data/rag_stats.json
      DEBUG: ${DEBUG:-false}
      AI_DB_USER: ${AI_DB_USER:-ea_ai}
      AI_DB_PASSWORD: ${DB_AI_PASSWORD:?请设置 DB_AI_PASSWORD}
      EVENT_DB_USER: ea_events
      EVENT_DB_PASSWORD: ${DB_EVENT_PASSWORD:?请设置 DB_EVENT_PASSWORD}
    volumes:
      - chroma_data:/app/ai-ecommerce-assistant/data:ro
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      db-grant:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ea-network

  # 显式数据导入：默认 dry-run，不会在 docker compose up 时自动执行。
  # 用法：
  #   docker compose --profile data-import run --rm data-import --mode dry-run
  #   docker compose --profile data-import run --rm data-import --mode bootstrap
  data-import:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ea-data-import
    profiles: ["data-import"]
    restart: "no"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ai_commerce_intelligence_platform}
      MIGRATION_DB_USER: ea_sync
      MIGRATION_DB_PASSWORD: ${DB_SYNC_PASSWORD:?请设置 DB_SYNC_PASSWORD}
      IMPORT_OPERATOR: ${IMPORT_OPERATOR:-operator}
    volumes:
      - ./data:/app/data:ro
    entrypoint: ["python", "backend/scripts/import_orders.py"]
    command: ["--mode", "dry-run"]
    depends_on:
      mysql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      db-grant:
        condition: service_completed_successfully
    networks:
      - ea-network

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: ea-streamlit
    restart: unless-stopped
    expose:
      - "8501"
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --server.baseUrlPath=/BI
      - --browser.gatherUsageStats=false
      - --server.fileWatcherType=none
    environment:
      # BI 默认读取运行期业务库（只读账号），读取失败回退 data/ 快照；
      # 页面缓存 30 秒，侧边栏刷新按钮会立即重读。
      BI_DATA_SOURCE: db
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-ai_commerce_intelligence_platform}
      DB_USER: ea_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?请设置 DB_APP_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      db-grant:
        condition: service_completed_successfully
    networks:
      - ea-network

  ai-assistant:
    build:
      context: .
      dockerfile: ai-ecommerce-assistant/Dockerfile
    container_name: ea-ai-assistant
    restart: unless-stopped
    environment:
      # 页面只调用后端；模型、数据库、额度、并发与审计全部在后端执行。
      BACKEND_API_URL: http://backend:8000
      LOGIN_URL: ${LOGIN_URL:-/login}
      LOGOUT_URL: ${LOGOUT_URL:-/logout}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-ea_session}
      AI_READ_TIMEOUT_SECONDS: ${AI_QUERY_TIMEOUT_SECONDS:-120}
    command:
      - streamlit
      - run
      - app.py
      - --server.port=8502
      - --server.address=0.0.0.0
      - --server.headless=true
      - --server.baseUrlPath=/ai
      - --browser.gatherUsageStats=false
      - --server.fileWatcherType=none
    expose:
      - "8502"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ea-network

  nginx:
    image: nginx:alpine
    container_name: ea-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      streamlit:
        condition: service_started
      ai-assistant:
        condition: service_started
    networks:
      - ea-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local

networks:
  ea-network:
    driver: bridge
