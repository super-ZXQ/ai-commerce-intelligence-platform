name: Docker Compose Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-start:
    name: 空卷全栈冷启动
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 写入仅用于 CI 的 Compose 配置
        run: |
          cat > .env <<'EOF'
          DB_ROOT_PASSWORD=ci-root-password
          DB_APP_PASSWORD=ci-app-password
          DB_AI_PASSWORD=ci-ai-password
          DB_SYNC_PASSWORD=ci-sync-password
          DB_EVENT_PASSWORD=ci-event-password
          DB_AUTH_PASSWORD=ci-auth-password
          DB_MIGRATE_PASSWORD=ci-migrate-password
          MIGRATION_DB_USER=ea_migrate
          DB_NAME=ai_commerce_intelligence_platform
          REDIS_PASSWORD=
          REDIS_DB=0
          REDIS_SESSION_DB=1
          NGINX_PORT=80
          JWT_SECRET=ci-docker-secret-not-for-production
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=admin123
          ANALYST_USERNAME=analyst
          ANALYST_PASSWORD=analyst123
          DEBUG=true
          AUTH_COOKIE_NAME=ea_session
          AUTH_COOKIE_SECURE=false
          AUTH_COOKIE_SAMESITE=lax
          LOGIN_URL=/login
          LOGOUT_URL=/logout
          AI_MAX_CONCURRENCY=2
          AI_MAX_INFLIGHT_PER_USER=1
          AI_DAILY_REQUEST_LIMIT=200
          AI_QUEUE_TIMEOUT_SECONDS=10
          AI_QUERY_TIMEOUT_SECONDS=120
          LLM_API_KEY=
          LLM_BASE_URL=https://api.deepseek.com
          LLM_MODEL=deepseek-chat
          EOF
          docker compose config --quiet

      - name: 从空卷构建并启动全栈
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d --build

      - name: 等待统一入口就绪
        run: |
          for i in {1..90}; do
            if curl --fail --silent --max-time 5 http://localhost/nginx-health >/dev/null; then
              echo "全栈已就绪"
              exit 0
            fi
            echo "等待全栈启动（$i/90）..."
            sleep 10
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: 验证数据、主要入口与 WebSocket
        run: |
          # Schema 权威：Alembic
          version="$(docker compose exec -T mysql mysql \
            -uroot -pci-root-password -Nse \
            'SELECT version_num FROM ai_commerce_intelligence_platform.alembic_version')"
          echo "alembic_version=$version"
          test "$version" = "0004_auth_identity"

          for t in orders order_events app_metadata alembic_version data_state \
                   data_import_runs order_status_reconciliation \
                   auth_users service_clients auth_audit_log ai_query_audit; do
            docker compose exec -T mysql mysql \
              -uroot -pci-root-password -Nse \
              "SHOW TABLES FROM ai_commerce_intelligence_platform LIKE '$t'" | grep -q "$t"
          done

          # 表级最小权限：ea_ai 只能读 orders，不能读认证表。
          docker compose exec -T mysql mysql -uea_ai -pci-ai-password -Nse \
            'SELECT COUNT(*) FROM ai_commerce_intelligence_platform.orders' >/dev/null
          if docker compose exec -T mysql mysql -uea_ai -pci-ai-password -Nse \
            'SELECT COUNT(*) FROM ai_commerce_intelligence_platform.auth_users' >/dev/null 2>&1; then
            echo "ea_ai 不应读取 auth_users"; exit 1
          fi
          # ea_auth 只能访问认证表，不能读 orders。
          docker compose exec -T mysql mysql -uea_auth -pci-auth-password -Nse \
            'SELECT COUNT(*) FROM ai_commerce_intelligence_platform.auth_users' >/dev/null
          if docker compose exec -T mysql mysql -uea_auth -pci-auth-password -Nse \
            'SELECT COUNT(*) FROM ai_commerce_intelligence_platform.orders' >/dev/null 2>&1; then
            echo "ea_auth 不应读取 orders"; exit 1
          fi

          # 最小权限账号验收：正向/负向语句全部按 docs/DB_PERMISSIONS.md 断言。
          docker compose --profile verify run --rm --no-deps db-verify

          # 订单数据只能由显式 data-import 导入；后端启动不得触碰 orders。
          docker compose --profile data-import run --rm data-import --mode bootstrap

          row_count="$(docker compose exec -T mysql mysql \
            -uroot -pci-root-password -Nse \
            'SELECT COUNT(*) FROM ai_commerce_intelligence_platform.orders')"
          test "$row_count" = "102287"
          echo "订单数据行数：$row_count"

          import_status="$(docker compose exec -T mysql mysql \
            -uroot -pci-root-password -Nse \
            'SELECT status FROM ai_commerce_intelligence_platform.data_import_runs ORDER BY id DESC LIMIT 1')"
          test "$import_status" = "completed"

          # 运行期创建/退款/取消后重启：订单与事件账本必须保留。
          docker compose exec -T backend python - <<'PY'
          import json
          import httpx

          base = "http://localhost:8000"
          token = httpx.post(
              f"{base}/api/auth/login",
              json={"username": "admin", "password": "admin123"},
          ).json()["access_token"]
          headers = {"Authorization": f"Bearer {token}"}

          def send(order_id, event_type, version, payload):
              response = httpx.post(
                  f"{base}/api/order-events",
                  headers=headers,
                  json={
                      "event_id": f"{order_id}-{version}",
                      "order_id": order_id,
                      "event_type": event_type,
                      "occurred_at": "2026-11-01T10:00:00+00:00",
                      "version": version,
                      "source": "docker-smoke",
                      "payload": payload,
                  },
                  timeout=30,
              )
              response.raise_for_status()
              assert response.json()["processed"] == 1, response.text

          created = "CI-RETENTION-CREATED"
          refunded = "CI-RETENTION-REFUNDED"
          cancelled = "CI-RETENTION-CANCELLED"
          payload = {
              "user_name": "ci-retention",
              "product_id": "CI-PRODUCT",
              "order_amount": "10.00",
              "payment_amount": "10.00",
              "discount_amount": "0.00",
              "platform_type": "APP",
          }
          send(created, "ORDER_CREATED", 1, payload)
          send(refunded, "ORDER_CREATED", 1, payload)
          send(refunded, "ORDER_REFUNDED", 2, {})
          send(cancelled, "ORDER_CREATED", 1, payload)
          send(cancelled, "ORDER_CANCELLED", 2, {})
          print("runtime orders sent")
          PY

          docker compose restart backend
          for i in {1..60}; do
            if curl --fail --silent --max-time 5 http://localhost/health >/dev/null; then
              break
            fi
            sleep 2
          done

          retention_rows="$(docker compose exec -T mysql mysql \
            -uroot -pci-root-password -Nse \
            "SELECT COUNT(*) FROM ai_commerce_intelligence_platform.orders WHERE order_id LIKE 'CI-RETENTION-%'")"
          test "$retention_rows" = "3"
          retention_status="$(docker compose exec -T mysql mysql \
            -uroot -pci-root-password -Nse \
            "SELECT GROUP_CONCAT(order_status ORDER BY order_id) FROM ai_commerce_intelligence_platform.orders WHERE order_id LIKE 'CI-RETENTION-%'")"
          test "$retention_status" = "ACTIVE,CANCELLED,REFUNDED"
          ledger_rows="$(docker compose exec -T mysql mysql \
            -uroot -pci-root-password -Nse \
            "SELECT COUNT(*) FROM ai_commerce_intelligence_platform.order_events WHERE order_id LIKE 'CI-RETENTION-%'")"
          test "$ledger_rows" = "5"

          # 备份 → 恢复临时库 → 关键表行数对比；这是备份可用性的验收证据。
          bash scripts/backup_restore_drill.sh

          # db-migrate / db-grant 应已成功退出
          migrate_status="$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' ea-db-migrate)"
          echo "db-migrate: $migrate_status"
          echo "$migrate_status" | grep -q 'exited 0'
          grant_status="$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' ea-db-grant)"
          echo "db-grant: $grant_status"
          echo "$grant_status" | grep -q 'exited 0'

          # 应用容器以非 root 运行。
          for service in backend streamlit ai-assistant; do
            uid="$(docker compose exec -T "$service" id -u)"
            echo "$service uid=$uid"
            test "$uid" = "10001"
          done

          # 公开页面与探针无需登录。
          for path in / /docs /demo /monitor /health-panel /livez /readyz; do
            status="$(curl --location --silent --output /dev/null \
              --write-out '%{http_code}' --max-time 20 "http://localhost${path}")"
            echo "$path -> $status"
            test "$status" = "200"
          done

          # 未登录访问 BI / AI 必须跳到登录页，不能直接拿到页面。
          for path in /BI/ /ai/; do
            headers="$(curl --silent --output /dev/null --dump-header - \
              --max-time 20 "http://localhost${path}" | tr -d '\r')"
            echo "$headers" | grep -q '^HTTP/1.1 302'
            echo "$headers" | grep -qi '^location: /login'
            echo "$path 未登录 -> 302 /login"
          done

          # 统一 HttpOnly Cookie 登录；Streamlit 从同源 Cookie 读取会话。
          curl --fail --silent --show-error -c /tmp/ea-cookies.txt \
            -X POST http://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' >/dev/null
          grep -q 'ea_session' /tmp/ea-cookies.txt
          for path in /BI/ /ai/; do
            status="$(curl --silent --output /dev/null -b /tmp/ea-cookies.txt \
              --write-out '%{http_code}' --max-time 20 "http://localhost${path}")"
            echo "$path 已登录 -> $status"
            test "$status" = "200"
          done

          ws_status="$(curl --http1.1 --silent --output /dev/null \
            --write-out '%{http_code}' --max-time 3 \
            -b /tmp/ea-cookies.txt \
            --header 'Connection: Upgrade' \
            --header 'Upgrade: websocket' \
            --header 'Origin: http://localhost' \
            --header 'Sec-WebSocket-Version: 13' \
            --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
            --header 'Sec-WebSocket-Protocol: streamlit' \
            http://localhost/BI/_stcore/stream || true)"
          echo "WebSocket handshake -> $ws_status"
          test "$ws_status" = "101"

      - name: 输出失败诊断
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=300 || true

      - name: 清理容器与卷
        if: always()
        run: docker compose down -v --remove-orphans || true
