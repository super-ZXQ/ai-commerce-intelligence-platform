# CodeQL 静态分析：仓库为 public，无需 GitHub Advanced Security 授权。
# 结果上传到 Security 标签页；发现漏洞不会让工作流失败，也不会阻塞合并。
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 03:00 UTC 全量扫描，覆盖依赖/规则更新后的新问题。
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: 分析
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
