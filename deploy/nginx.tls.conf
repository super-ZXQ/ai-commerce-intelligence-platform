# HTTPS 终止配置（可选生产层）。
#
# 用法：
#   1. 将证书放到 deploy/certs/fullchain.pem 与 deploy/certs/privkey.pem
#   2. docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#   3. .env 中设置 AUTH_COOKIE_SECURE=true（覆盖层会强制注入）
#
# 该文件与 deploy/nginx.conf 的路由/鉴权行为保持一致；修改路由时两处必须同步，
# backend/tests/test_operations.py 会校验关键鉴权块存在。

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
    }

    upstream streamlit_bi {
        zone streamlit_bi 64k;
        server streamlit:8501 resolve;
    }

    upstream ai_assistant {
        zone ai_assistant 64k;
        server ai-assistant:8502 resolve;
    }

    # 仅用于负载均衡健康检查与证书续期校验；其余 HTTP 一律跳转 HTTPS。
    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        client_max_body_size 100m;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS 仅在此 HTTPS server 下发；HTTP 跳转响应不携带。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # Nginx auth_request 子请求：只校验 HttpOnly 会话 Cookie（或 Bearer）。
        location = /_auth {
            internal;
            proxy_pass http://backend/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        location = /api/ai/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location ~ ^/(docs|redoc|openapi\.json|demo|monitor|health-panel|health|livez|readyz|metrics)$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health/detailed {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /login {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /nav {
            proxy_pass http://backend/;
        }

        location = /BI {
            return 301 /BI/;
        }

        location /BI/ {
            auth_request /_auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;

            proxy_pass http://streamlit_bi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-User $auth_user;
            proxy_read_timeout 86400;
        }

        location = /ai {
            return 301 /ai/;
        }

        location /ai/ {
            auth_request /_auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;

            proxy_pass http://ai_assistant;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-User $auth_user;
            proxy_read_timeout 86400;
        }

        location @login_redirect {
            return 302 /login?next=$uri;
        }

        location @forbidden {
            default_type text/plain;
            return 403 "当前账号无权访问该页面\n";
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
