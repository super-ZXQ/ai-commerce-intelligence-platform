bind 0.0.0.0
port 6379
# 显式 bind 会使 protected-mode 的自动保护失效；认证密码由 docker-compose
# 通过 --requirepass 注入（REDIS_PASSWORD），不要把 6379 映射到宿主机。
protected-mode yes
timeout 300
tcp-keepalive 60
daemonize no
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
maxmemory 256mb
maxmemory-policy allkeys-lru
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data
loglevel notice
