worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # 访问日志带上 Nginx 生成的 request_id，与 FastAPI/Agent 日志对齐。
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'request_id=$request_id request_time=$request_time';

    # 边缘限流：应用内限流是进程级状态，Nginx 作为统一入口先挡一层。
    # 登录接口单独收紧，防止账号爆破在到达后端前就耗尽连接。
    limit_req_zone $binary_remote_addr zone=api_edge:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_edge:10m rate=10r/m;
    # 探针与指标端点公开且不计入应用内限流桶：/readyz 每次要占用业务库、事件库、
    # 认证库三个连接并 ping 一次 Redis，匿名循环即可打满连接池、拖垮真实 BI 查询。
    # 额度对负载均衡轮询足够宽松，但足以阻止放大攻击。
    limit_req_zone $binary_remote_addr zone=probe_edge:10m rate=5r/s;
    limit_req_status 429;
    # Docker 容器重建后 IP 会变化；让 Nginx 定期通过内置 DNS 刷新上游地址。
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
    }

    upstream streamlit_bi {
        zone streamlit_bi 64k;
        server streamlit:8501 resolve;
    }

    upstream ai_assistant {
        zone ai_assistant 64k;
        server ai-assistant:8502 resolve;
    }

    server {
        listen 80;
        server_name _;
        server_tokens off;
        access_log /var/log/nginx/access.log main;

        # 统一安全头必须同时覆盖 Nginx 直出与 /BI/、/ai/ 反代响应；
        # Streamlit 依赖内联脚本/样式，因此保留 unsafe-inline/unsafe-eval；
        # 仅额外放行 Swagger/ReDoc 的 jsDelivr CDN，仍禁止跨站嵌套。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob: https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        client_max_body_size 100m;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # Nginx auth_request 子请求：只校验 HttpOnly 会话 Cookie（或 Bearer），
        # 返回 200/401，不向浏览器暴露任何凭据。内部子请求不计入业务限流。
        location = /_auth {
            internal;
            proxy_pass http://backend/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            # auth_request 默认会把客户端原始请求头一并带进子请求，浏览器自行发送
            # X-Required-Scope 就能覆盖后端按 URI 推导的页面权限（viewer 打开 /ai/ 壳）；
            # 该头只允许由服务端推导，此处显式清空。
            proxy_set_header X-Required-Scope "";
            # 后端按 X-Original-URI 推导页面所需权限（/BI/ → data:read，/ai/ → ai:query）。
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # 登录接口单独限流；exact location 优先于 /api/ 前缀匹配。
        location = /api/auth/login {
            limit_req zone=login_edge burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        location /api/ {
            limit_req zone=api_edge burst=60 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # AI 流式入口：NDJSON 必须逐行下发，禁止 Nginx 缓冲整个回答。
        location = /api/ai/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location ~ ^/(docs|redoc|openapi\.json|demo|monitor|health-panel)$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # 公开探针与指标：匿名可达，必须在边缘限流，否则成为连接池放大入口。
        location ~ ^/(health|livez|readyz|metrics)$ {
            limit_req zone=probe_edge burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /health/detailed {
            limit_req zone=probe_edge burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /login {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /nav {
            proxy_pass http://backend/;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /BI {
            return 301 /BI/;
        }

        # BI 看板与 WebSocket 握手统一走会话校验；health 端点不受影响。
        location /BI/ {
            auth_request /_auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;

            proxy_pass http://streamlit_bi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Auth-User $auth_user;
            proxy_read_timeout 86400;
        }

        location = /ai {
            return 301 /ai/;
        }

        location /ai/ {
            auth_request /_auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;

            proxy_pass http://ai_assistant;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Auth-User $auth_user;
            proxy_read_timeout 86400;
        }

        location @login_redirect {
            return 302 /login?next=$uri;
        }

        location @forbidden {
            default_type text/plain;
            return 403 "当前账号无权访问该页面\n";
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
