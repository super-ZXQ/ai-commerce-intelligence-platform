events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    # Docker 容器重建后 IP 会变化；让 Nginx 定期通过内置 DNS 刷新上游地址。
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
    }

    upstream streamlit_bi {
        zone streamlit_bi 64k;
        server streamlit:8501 resolve;
    }

    upstream ai_assistant {
        zone ai_assistant 64k;
        server ai-assistant:8502 resolve;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 100m;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # Nginx auth_request 子请求：只校验 HttpOnly 会话 Cookie（或 Bearer），
        # 返回 200/401，不向浏览器暴露任何凭据。内部子请求不计入业务限流。
        location = /_auth {
            internal;
            proxy_pass http://backend/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # AI 流式入口：NDJSON 必须逐行下发，禁止 Nginx 缓冲整个回答。
        location = /api/ai/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location ~ ^/(docs|redoc|openapi\.json|demo|monitor|health-panel|health|livez|readyz|metrics)$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health/detailed {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /login {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /nav {
            proxy_pass http://backend/;
        }

        location = /BI {
            return 301 /BI/;
        }

        # BI 看板与 WebSocket 握手统一走会话校验；health 端点不受影响。
        location /BI/ {
            auth_request /_auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;

            proxy_pass http://streamlit_bi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-User $auth_user;
            proxy_read_timeout 86400;
        }

        location = /ai {
            return 301 /ai/;
        }

        location /ai/ {
            auth_request /_auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;

            proxy_pass http://ai_assistant;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-User $auth_user;
            proxy_read_timeout 86400;
        }

        location @login_redirect {
            return 302 /login?next=$uri;
        }

        location @forbidden {
            default_type text/plain;
            return 403 "当前账号无权访问该页面\n";
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
